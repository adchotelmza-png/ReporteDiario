<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark light">
    <title>Reserva de Habitaciones - Agua del Corral - Restaurante & SPA</title>
    
    <!-- Configuración compartida de Firebase -->
    <script src="config.js"></script>

    <script>
        (function () {
            var theme = 'dark';
            try { if (localStorage.getItem('theme') === 'light') theme = 'light'; } catch (e) {}
            document.documentElement.setAttribute('data-theme', theme);
            document.write('<link id="theme-stylesheet" rel="stylesheet" href="' + theme + '.css">');
        })();
    </script>
    <noscript><link rel="stylesheet" href="dark.css"></noscript>
    
    <style>
        .hidden { display: none !important; }
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: var(--color-fondo, #f8fafc); color: var(--color-texto, #1e293b); margin: 0; padding: 0; }
        .booking-container { max-width: 680px; margin: 40px auto; padding: 2.5rem; background: var(--color-card-bg, #ffffff); border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid rgba(128,128,128,0.15); }
        .brand-header { text-align: center; margin-bottom: 2rem; }
        .brand-header h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; margin: 0 0 0.5rem; color: var(--color-principal, #0891b2); }
        .brand-header p { font-size: 0.95rem; opacity: 0.7; margin: 0; }
        
        .form-section { margin-bottom: 1.8rem; }
        .section-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 2px solid rgba(8, 145, 178, 0.15); display: flex; align-items: center; gap: 8px; color: var(--color-principal, #0891b2); }
        
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .form-group-full { grid-column: span 2; }
        
        .form-label { font-size: 0.85rem; font-weight: 600; opacity: 0.9; }
        .form-input, .form-select { padding: 0.7rem 0.9rem; border-radius: 8px; border: 1px solid rgba(128,128,128,0.3); background: var(--color-input-bg, transparent); color: inherit; font-size: 0.95rem; transition: border-color 0.2s, box-shadow 0.2s; }
        .form-input:focus, .form-select:focus { outline: none; border-color: #0891b2; box-shadow: 0 0 0 3px rgba(8, 145, 178, 0.15); }
        
        .guest-card { background: rgba(128,128,128,0.03); border: 1px solid rgba(128,128,128,0.12); border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
        .guest-title { font-size: 0.9rem; font-weight: bold; margin-bottom: 0.75rem; color: #0891b2; display: flex; justify-content: space-between; align-items: center; }
        
        .btn-primary { background: #0891b2; color: white; border: none; padding: 0.85rem 1.5rem; font-size: 1rem; font-weight: 600; border-radius: 8px; cursor: pointer; width: 100%; transition: filter 0.2s, transform 0.1s; }
        .btn-primary:hover { filter: brightness(1.08); }
        .btn-primary:active { transform: scale(0.98); }
        
        .success-box { text-align: center; padding: 2rem 0; }
        .success-box svg { width: 64px; height: 64px; color: #10b981; margin-bottom: 1rem; }
    </style>
    <link rel="icon" type="image/png" href="Icono.png">
</head>
<body>

    <div class="booking-container">
        <div class="brand-header">
            <h1>Agua del Corral</h1>
            <p>Restaurante & SPA — Sistema de Reservas</p>
        </div>

        <form id="reserva-form">
            <!-- SECCIÓN 1: ESTADÍA Y HUÉSPEDES -->
            <div class="form-section">
                <div class="section-title">1. Fechas y Ocupación</div>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="fecha-ingreso" class="form-label">Fecha de Ingreso (Check-in)</label>
                        <input type="date" id="fecha-ingreso" required class="form-input">
                    </div>
                    <div class="form-group">
                        <label for="fecha-salida" class="form-label">Fecha de Salida (Check-out)</label>
                        <input type="date" id="fecha-salida" required class="form-input">
                    </div>
                    <div class="form-group form-group-full">
                        <label for="cantidad-huespedes" class="form-label">Cantidad de Huéspedes</label>
                        <select id="cantidad-huespedes" class="form-select">
                            <option value="1">1 Huésped</option>
                            <option value="2" selected>2 Huéspedes</option>
                            <option value="3">3 Huéspedes</option>
                            <option value="4">4 Huéspedes</option>
                            <option value="5">5 Huéspedes</option>
                            <option value="6">6 Huéspedes</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- CONTENEDOR DINÁMICO DE HUÉSPEDES -->
            <div class="form-section">
                <div class="section-title">2. Datos de los Huéspedes</div>
                <div id="huespedes-container"></div>
            </div>

            <!-- DATOS DE CONTACTO Y FACTURACIÓN -->
            <div class="form-section">
                <div class="section-title">3. Contacto y Facturación</div>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="email" class="form-label">Email de contacto</label>
                        <input type="email" id="email" required class="form-input" placeholder="correo@ejemplo.com">
                    </div>
                    <div class="form-group">
                        <label for="telefono" class="form-label">Teléfono de contacto</label>
                        <input type="tel" id="telefono" required class="form-input" placeholder="+54 9 ...">
                    </div>
                    <div class="form-group">
                        <label for="pais" class="form-label">País</label>
                        <input type="text" id="pais" required class="form-input" value="Argentina">
                    </div>
                    <div class="form-group">
                        <label for="direccion" class="form-label">Dirección</label>
                        <input type="text" id="direccion" required class="form-input" placeholder="Calle y número">
                    </div>
                    <div class="form-group form-group-full" style="margin-top: 0.5rem; background: rgba(128,128,128,0.04); padding: 1rem; border-radius: 8px; border: 1px dashed rgba(128,128,128,0.2);">
                        <label for="cuit" class="form-label">En caso de necesitar factura A, por favor complete el siguiente campo:</label>
                        <input type="text" id="cuit" class="form-input" placeholder="CUIT (Ej: 20-12345678-9)">
                    </div>
                </div>
            </div>

            <!-- SECCIÓN PAGO (OCULTA TEMPORALMENTE) -->
            <div class="form-section hidden" id="seccion-pago">
                <div class="section-title">Forma de Pago (Garantía)</div>
                <div class="form-grid">
                    <div class="form-group form-group-full">
                        <label class="form-label">Número de Tarjeta</label>
                        <input type="text" id="cc-numero" class="form-input" placeholder="4532 •••• •••• ••••">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Vencimiento (MM/AA)</label>
                        <input type="text" id="cc-vencimiento" class="form-input" placeholder="MM/AA">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Código de Seguridad</label>
                        <input type="password" id="cc-cvc" class="form-input" maxlength="4" placeholder="CVC">
                    </div>
                    <div class="form-group form-group-full">
                        <label class="form-label">Titular de la Tarjeta</label>
                        <input type="text" id="cc-titular" class="form-input" placeholder="Nombre completo como figura en la tarjeta">
                    </div>
                </div>
            </div>

            <button type="submit" id="btn-enviar" class="btn-primary">Confirmar Reserva</button>
        </form>

        <div id="resultado-exito" class="success-box hidden">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            <h2 style="font-family:'Playfair Display',serif; color:#0891b2; margin-bottom:0.5rem;">¡Reserva Registrada con Éxito!</h2>
            <p id="codigo-reserva-txt" style="font-size:1.1rem; font-weight:bold; margin-bottom:1rem;"></p>
            <p style="opacity:0.8; font-size:0.95rem; margin-bottom:1.5rem;">Los datos fueron guardados correctamente en la base de datos de Agua del Corral.</p>
            <button type="button" class="btn-primary" onclick="location.reload()" style="max-width:200px; margin:0 auto;">Nueva Reserva</button>
        </div>
    </div>

    <!-- Script para renderizado dinámico y conexión con Firebase -->
    <script type="module">
        import { FirebaseService } from './firebase-service.js';
        
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                await FirebaseService.init(
                    () => console.log("Firebase conectado en reservas"),
                    () => console.log("Auth listo"),
                    err => console.error("Error al iniciar Firebase:", err)
                );
            } catch (e) {
                console.error("No se pudo inicializar Firebase:", e);
            }

            const hoy = new Date();
            const manana = new Date(hoy);
            manana.setDate(manana.getDate() + 1);
            
            const formatDateInput = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            
            const inputIngreso = document.getElementById('fecha-ingreso');
            const inputSalida = document.getElementById('fecha-salida');
            
            inputIngreso.value = formatDateInput(hoy);
            inputSalida.value = formatDateInput(manana);
            inputIngreso.min = formatDateInput(hoy);
            
            inputIngreso.addEventListener('change', () => {
                if (inputIngreso.value >= inputSalida.value) {
                    const d = new Date(inputIngreso.value);
                    d.setDate(d.getDate() + 1);
                    inputSalida.value = formatDateInput(d);
                }
                inputSalida.min = inputIngreso.value;
            });

            const selectCant = document.getElementById('cantidad-huespedes');
            const containerHuespedes = document.getElementById('huespedes-container');

            function renderHuespedes() {
                const cant = parseInt(selectCant.value) || 1;
                let html = '';
                for (let i = 1; i <= cant; i++) {
                    html += `
                        <div class="guest-card">
                            <div class="guest-title">
                                <span>Huésped ${i} ${i === 1 ? '(Principal / Responsable)' : ''}</span>
                            </div>
                            <div class="form-grid">
                                <div class="form-group form-group-full">
                                    <label class="form-label">Nombre y Apellido Completo *</label>
                                    <input type="text" name="huesped_${i}_nombre" required class="form-input" placeholder="Nombre completo">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Fecha de Nacimiento *</label>
                                    <input type="date" name="huesped_${i}_nacimiento" required class="form-input">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">DNI / Pasaporte / Documento *</label>
                                    <input type="text" name="huesped_${i}_doc" required class="form-input" placeholder="Número de documento">
                                </div>
                            </div>
                        </div>
                    `;
                }
                containerHuespedes.innerHTML = html;
            }

            selectCant.addEventListener('change', renderHuespedes);
            renderHuespedes();

            const form = document.getElementById('reserva-form');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('btn-enviar');
                btn.disabled = true;
                btn.textContent = 'Guardando reserva...';

                const cant = parseInt(selectCant.value);
                const huespedes = [];
                for (let i = 1; i <= cant; i++) {
                    huespedes.push({
                        nombre: form.querySelector(`[name="huesped_${i}_nombre"]`).value.trim(),
                        fechaNacimiento: form.querySelector(`[name="huesped_${i}_nacimiento"]`).value,
                        documento: form.querySelector(`[name="huesped_${i}_doc"]`).value.trim()
                    });
                }

                const fmtDate = iso => {
                    if (!iso) return '';
                    const [y, m, d] = iso.split('-');
                    return `${d}/${m}/${y}`;
                };

                const refCodigo = 'ADC-' + Math.floor(1000 + Math.random() * 9000);

                const reservaData = {
                    fechaIngreso: fmtDate(inputIngreso.value),
                    fechaSalida: fmtDate(inputSalida.value),
                    cantidadHuespedes: cant,
                    huespedes: huespedes,
                    contacto: {
                        email: document.getElementById('email').value.trim(),
                        telefono: document.getElementById('telefono').value.trim(),
                        pais: document.getElementById('pais').value.trim(),
                        direccion: document.getElementById('direccion').value.trim()
                    },
                    facturaA: {
                        cuit: document.getElementById('cuit').value.trim() || null
                    },
                    estado: 'Confirmada',
                    creadoEn: new Date().toISOString()
                };

                try {
                    await FirebaseService.addNovedad({
                        turno: 'Reserva Web',
                        prioridad: 'Media',
                        areaElemento: 'Reservas',
                        nReserva: refCodigo,
                        novedad: `Reserva online de ${cant} huésped(es). Ingreso: ${reservaData.fechaIngreso} - Salida: ${reservaData.fechaSalida}. Contacto: ${reservaData.contacto.email}`,
                        notificadoA: 'Recepción, Reservas',
                        reservaDetalle: reservaData
                    });

                    form.classList.add('hidden');
                    const exitoBox = document.getElementById('resultado-exito');
                    exitoBox.classList.remove('hidden');
                    document.getElementById('codigo-reserva-txt').textContent = `Código de Referencia: #${refCodigo}`;
                } catch (err) {
                    console.error("Error al guardar reserva:", err);
                    alert("Ocurrió un error al registrar la reserva. Por favor intente nuevamente.");
                    btn.disabled = false;
                    btn.textContent = 'Confirmar Reserva';
                }
            });
        });
    </script>
</body>
</html>
